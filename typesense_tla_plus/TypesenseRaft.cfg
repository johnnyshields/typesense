SPECIFICATION Spec

\* Constants for model checking
CONSTANTS
    Server = {S1, S2, S3}
    Follower = "Follower"
    Candidate = "Candidate" 
    Leader = "Leader"
    Down = "Down"
    Nil = "Nil"
    NoOp = "NoOp"
    MaxConfigVersion = 4
    MaxLogLen = 3

\* Invariants to check
INVARIANTS
    TypeInvariant
    LeaderSafety
    LogIntegrity
    CommitSafety
    AppliedCommitted
    SingleNodeChange
    QuorumOverlapSafety
    LeaderInConfig
    TermMonotonic
    ConfigVersionConsistent

\* Properties to check (uncomment for liveness checking)
\* PROPERTIES
\*     EventualLeader
\*     EventualApplication

\* Constraints to limit state space
CONSTRAINTS
    \* Limit terms to reasonable range
    \A s \in Server : currentTerm[s] <= 5
    \* Limit configuration versions
    Len(configs) <= MaxConfigVersion
    \* Limit log length
    \A s \in Server : Len(log[s]) <= MaxLogLen 