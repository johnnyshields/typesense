SPECIFICATION SafetySpec

\* Constants for safety model checking
CONSTANTS
    Server = {S1, S2, S3}
    Follower = "Follower"
    Candidate = "Candidate" 
    Leader = "Leader"
    Down = "Down"
    Nil = "Nil"
    NoOp = "NoOp"
    MaxConfigVersion = 3
    MaxLogLen = 2

\* Core safety invariants
INVARIANTS
    TypeInvariant
    TypesenseComprehensiveSafety

\* Individual safety properties for targeted checking
\* (uncomment specific ones to focus model checking)
\* INVARIANTS
\*     SafetyMonotonic
\*     LeaderSafetyValidation
\*     SafeConfigChangesOnly
\*     NoUnsafeTransitions
\*     TermSafety
\*     ConfigSafety
\*     LeaderSafetyMaintenance
\*     DisasterRecoverySafety

\* Constraints to manage state space
CONSTRAINTS
    \* Limit terms for model checking
    \A s \in Server : currentTerm[s] <= 4
    \* Limit safety validation counter
    \A s \in Server : safetyValidationCounter[s] <= 5
    \* Limit configuration versions
    Len(configs) <= MaxConfigVersion
    \* Limit log length  
    \A s \in Server : Len(log[s]) <= MaxLogLen

\* Action constraints to focus on safety-critical scenarios
ACTION_CONSTRAINTS
    \* Prioritize configuration changes and safety validation
    \/ \E s \in Server : PeriodicSafetyValidation(s)
    \/ \E s, t \in Server : SafeAddServer(s, t)
    \/ \E s, t \in Server : SafeRemoveServer(s, t)
    \/ \E s \in Server : StartElection(s)
    \/ \E s \in Server : BecomeLeader(s)
    \/ \E s \in Server : ServerDown(s)
    \/ \E s \in Server : ServerRecover(s) 